[package]
name = "airlang_bin"
version = "0.27.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Air is a universal, reliable, and lean programming language."
repository = "https://github.com/LambdaAlpha/airlang_rs"
keywords = ["programming-language", "dsl", "ast", "ir", "vm"]
categories = ["compilers"]

[lints]
workspace = true

[dependencies.airlang]
path = "../lib"
version = "0.27.0"

[dependencies.airlang_ext]
path = "../ext"
version = "0.27.0"

# repl
[dependencies.crossterm]
version = "0.29"

# repl
[dependencies.ratatui]
version = "0.30"
features = ["unstable-rendered-line-info"]

# repl
[dependencies.ratatui-textarea]
version = "0.9"

# repl
[dependencies.tui-scrollview]
version = "0.6"

# const str
[dependencies.const_format]
version = "0.2"

# log
[dev-dependencies.airlang_dev]
path = "../dev"
